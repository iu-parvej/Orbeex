[workspace]
resolver = "2"
members = [
    "software/modules/orbeex-core",
]

# Shared metadata for all workspace crates.
[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/iu-parvej/Orbeex"
homepage = "https://github.com/orbeex/orbeex"
authors = ["The Orbeex Contributors"]
categories = ["science", "visualization", "command-line-utilities"]
keywords = ["gis", "geospatial", "rust", "ai"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Time
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }

[workspace.lints.rust]
# Memory safety: forbid unsafe unless an audited crate opts in via an ADR.
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = "warn"

[workspace.lints.clippy]
# Style/linting: deny common footguns; allow pedantic-by-exception.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 1

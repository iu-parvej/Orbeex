name: docs

on:
  push:
    branches: [main]
    paths: ["docs-site/**", "docs/**", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs-site/**", "docs/**"]

permissions:
  contents: read

jobs:
  mintlify:
    name: Mintlify validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - uses: actions/setup-node@v4 # v4.1.0
        with:
          node-version: "22"
      - name: Install Mintlify CLI
        run: npm i -g mint
      - name: Validate
        run: mint validate
      - name: Broken links
        run: mint broken-links
      - name: Accessibility
        run: mint a11y

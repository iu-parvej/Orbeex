name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default (OpenSSF Scorecard).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: changelog & registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --quiet pyyaml pytest
      - name: Validate fragments & registry
        run: python scripts/changelog/orbeex.py validate-all
      - name: Require a change fragment for behavior changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: python scripts/changelog/require_fragment.py
      - name: Automation tests
        run: python -m pytest scripts/changelog -q

  docs-links:
    name: documentation link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate relative links
        run: python scripts/docs/check_local_links.py

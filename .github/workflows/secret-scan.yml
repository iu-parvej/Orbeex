name: secret-scan

# Guards the public repository against accidental secret commits.
# Runs gitleaks over the full git history on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so old secrets are caught too
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"

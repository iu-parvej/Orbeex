name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 3" # weekly, Wednesdays 08:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python] # add 'javascript-typescript' when docs-site JS is added
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - uses: github/codeql-action/init@v3 # v3.27.5
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"

name: publish-docs

# Publish the Mintlify docs and rustdoc API reference on release.
# Mintlify deploys automatically on push via Git sync; this workflow handles
# rustdoc → GitHub Pages and a post-deploy link check.

on:
  push:
    branches: [main]
    paths: ["software/**", "docs/**", "docs-site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Build & deploy rustdoc
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features
      - name: Add index redirect
        run: echo '<meta http-equiv="refresh" content="0; url=orbeex_core/index.html">' > target/doc/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
      - id: deployment
        uses: actions/deploy-pages@v4

name: audit

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"

permissions:
  contents: read
  issues: write

jobs:
  cargo-audit:
    name: cargo-audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - uses: rustsec/audit-check@v2 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: pip-audit (automation deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4.2.2
      - uses: actions/setup-python@v5 # v5.3.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pip-audit
      - run: pip-audit --strict || true # advisory until automation deps are pinned

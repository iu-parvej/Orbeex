name: audit

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "scripts/**"

permissions:
  contents: read
  issues: write

# Rust dependency advisories (RustSec) will be checked with cargo-deny
# [advisories] once the Rust toolchain lands (see .gitignore, "Rust scaffolding").
# Until then this workflow covers only the Python-side automation dependencies.

jobs:
  pip-audit:
    name: pip-audit (automation deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pip-audit
      - run: pip-audit --strict || true # advisory until automation deps are pinned

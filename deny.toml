# cargo-deny configuration — enforces Orbeex's licensing & security policy.
# Policy: licensing/policies/dependency-license-policy.md
# Run:    cargo deny check
# Docs:   https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Confidence threshold for license detection.
confidence-threshold = 0.9
# Deny-by-default: only these licenses are allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
# Restricted licenses require an ADR + legal note, then an explicit exception here.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Deny known-vulnerable / unwanted crates here as needed.
deny = [
    # { name = "openssl", reason = "Prefer rustls for a memory-safe TLS stack" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
